[build]
command = "npm run build:site"
publish = "web/dist"

[build.environment]
NODE_VERSION = "22"
# The database name is also the default in code; it is not a secret.
SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB"

[functions]
directory = "api/functions"
node_bundler = "esbuild"
external_node_modules = ["mongodb"]

[[headers]]
  for = "/testing"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/testing/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
